<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi To-Do Minimalis Editorial dengan Integrasi Cuaca Real-Time.">
    <title>ToDo App</title>
    <link rel="icon" href="assets/to-do-list.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">

        <header class="editorial-masthead">
            <div class="masthead-meta">
                <span id="current-date" class="date-tag"></span>
            </div>
            <h1 class="editorial-title">Daftar Tugas</h1>
        </header>

        <section id="weather-widget" class="weather-widget" aria-label="Informasi Cuaca Jakarta">
            <div id="weather-loading" class="weather-loading">
                <div class="weather-shimmer-line"></div>
            </div>

            <div id="weather-error" class="weather-error" style="display: none;">
                <span id="weather-error-msg" class="weather-error-msg">Gagal memuat status cuaca</span>
                <div id="weather-error-details" class="weather-error-details" style="display: none;"></div>
                <button id="weather-retry-btn" class="weather-retry-btn" type="button">Coba Lagi</button>
            </div>

            <div id="weather-data" class="weather-data" style="display: none;">
                <div class="weather-inline-main">
                    <img id="weather-icon" class="weather-icon-mono" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg/clear-day.svg" alt="Cuaca">
                    <div class="weather-summary-text">
                        <span class="weather-headline">
                            <strong>Hari ini di Jakarta:</strong> <span id="weather-temp">--°C</span> / <span id="weather-desc">Loading...</span>. <span id="weather-recommendation" class="weather-recommendation"></span>
                        </span>
                        <div class="weather-metrics">
                            <span>Lembap: <strong id="weather-humidity">--%</strong></span>
                            <span class="sep">•</span>
                            <span>Angin: <strong id="weather-wind">-- m/s</strong></span>
                            <span class="sep">•</span>
                            <span>Terasa: <strong id="weather-feels">--°C</strong></span>
                            <span class="sep">•</span>
                            <span id="weather-updated" class="weather-updated">Updated: --:--</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <main class="app-main">
            <div class="input-container">
                <input type="text" id="todo-input" class="todo-input" placeholder="+ Tambahkan tugas baru lalu tekan Enter" autocomplete="off">
            </div>

            <div class="editorial-toolbar">
                <div class="filters">
                    <button type="button" class="filter-btn active" data-filter="all">Semua</button>
                    <button type="button" class="filter-btn" data-filter="active">Aktif</button>
                    <button type="button" class="filter-btn" data-filter="completed">Selesai</button>
                </div>
                <span id="items-left" class="items-count">0 tugas tersisa</span>
            </div>

            <ul id="todo-list" class="todo-list">
            </ul>

            <footer class="app-footer">

            </footer>
        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
